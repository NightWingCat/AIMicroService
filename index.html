<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>전생 체험관</title>
<meta name="description" content="팀명과 이름을 적고 전생 체험하기를 누르면, 우리가 전생에 어떤 사이였는지 한 폭의 명화와 한 줄의 대사로 보여 드려요." />
<meta property="og:title" content="전생 체험관 — 우리는 전생에 어떤 사이였을까" />
<meta property="og:description" content="팀명과 이름만으로 보는, 동료들과의 전생 인연 한 폭." />
<meta name="theme-color" content="#07060f" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff6d8'/%3E%3Cstop offset='.45' stop-color='%23b9a6ff'/%3E%3Cstop offset='1' stop-color='%2307060f'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2307060f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='url(%23g)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07060f;
    --glass: rgba(255, 255, 255, .045);
    --glass-2: rgba(255, 255, 255, .08);
    --line: rgba(205, 190, 255, .16);
    --line-2: rgba(205, 190, 255, .3);
    --text: #ece7f8;
    --text-2: #b8b0d4;
    --text-3: #857da3;
    --violet: #a594ff;
    --violet-2: #c9bcff;
    --gold: #e2c27a;
    --gold-2: #f3dfa6;
    --rose: #f3a6c0;
    --glow: 0 0 24px rgba(165, 148, 255, .45), 0 0 60px rgba(165, 148, 255, .18);
    --serif: "Gowun Batang", "AppleMyungjo", serif;
    --latin: "Cormorant Garamond", "Gowun Batang", serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-family: var(--serif); font-size: 16px; line-height: 1.75;
    background: radial-gradient(ellipse 90% 60% at 50% -10%, #241c4d 0%, transparent 60%), radial-gradient(ellipse 70% 50% at 100% 100%, #2a1235 0%, transparent 60%), var(--bg);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- Dream sky ---------- */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .stars { position: absolute; inset: -50%; background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 120px 80px, #d8ccff, transparent),
      radial-gradient(1.5px 1.5px at 200px 160px, #fff8e0, transparent), radial-gradient(1px 1px at 60px 210px, #fff, transparent),
      radial-gradient(1px 1px at 260px 40px, #cfc3ff, transparent), radial-gradient(1.2px 1.2px at 300px 240px, #fff, transparent);
    background-size: 320px 280px; opacity: .55; animation: drift 180s linear infinite; }
  .stars.s2 { background-size: 520px 460px; opacity: .35; animation-duration: 260s; animation-direction: reverse; }
  @keyframes drift { to { transform: translate3d(-320px, -280px, 0); } }
  .fog { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(70px); opacity: .32; }
  .fog.f1 { background: #4b3aa8; left: -25vmax; top: 10vh; animation: float1 26s ease-in-out infinite alternate; }
  .fog.f2 { background: #8a2f6f; right: -30vmax; top: 50vh; opacity: .22; animation: float2 32s ease-in-out infinite alternate; }
  @keyframes float1 { to { transform: translate(14vmax, -8vmax) scale(1.1); } }
  @keyframes float2 { to { transform: translate(-12vmax, -14vmax) scale(.9); } }

  .wrap { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 56px 16px 90px; }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: 30px; }
  .eyebrow { font-family: var(--latin); letter-spacing: 6px; font-size: 13px; color: var(--violet-2); text-transform: uppercase; }
  h1 { font-weight: 700; font-size: clamp(34px, 8vw, 46px); margin: 10px 0 6px; letter-spacing: -1px;
    background: linear-gradient(180deg, #fff 20%, #c9bcff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { color: var(--text-2); margin: 0; word-break: keep-all; }
  .orb-mark { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #fff6d8 0%, #b9a6ff 40%, rgba(165,148,255,0) 72%); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.12); filter: brightness(1.2); } }

  /* ---------- Panel ---------- */
  .panel { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 22px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .hint { text-align: center; font-size: 13.5px; color: var(--text-3); margin: 0 0 16px; word-break: keep-all; }
  .rows { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 38px; gap: 8px; align-items: start; }
  .field { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(10, 8, 25, .55); outline: none; transition: .2s; font-size: 16px; }
  .field::placeholder { color: var(--text-3); }
  .field:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(165,148,255,.18), var(--glow); }
  .del { width: 38px; height: 48px; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--text-3); cursor: pointer; font-size: 18px; }
  .del:hover { color: var(--rose); border-color: var(--line); }
  .del:disabled { opacity: .25; cursor: default; }
  .add { width: 100%; margin-top: 12px; height: 44px; border-radius: 12px; border: 1px dashed var(--line-2); background: transparent; color: var(--text-2); cursor: pointer; transition: .2s; }
  .add:hover { border-color: var(--violet); color: var(--violet-2); }
  .add:disabled { opacity: .4; cursor: default; }

  details.ai { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 13.5px; color: var(--text-3); }
  details.ai summary { cursor: pointer; list-style: none; text-align: center; }
  details.ai summary::-webkit-details-marker { display: none; }
  details.ai summary b { color: var(--violet-2); font-weight: 400; }
  .ai-body { display: grid; gap: 8px; margin-top: 12px; }
  .ai-row { display: grid; grid-template-columns: 1fr 140px; gap: 8px; }
  .ai-row .field { height: 42px; font-size: 14px; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
  .check input { accent-color: var(--violet); }

  .go {
    display: block; width: 100%; margin-top: 20px; height: 62px; border: 0; border-radius: 999px; cursor: pointer; position: relative; overflow: hidden;
    font-size: 19px; font-weight: 700; letter-spacing: 2px; color: #0b0918;
    background: radial-gradient(circle at 50% 0%, #fffaf0 0%, #d9ceff 45%, #a594ff 100%); box-shadow: var(--glow); transition: transform .2s, box-shadow .2s;
  }
  .go:hover { transform: translateY(-1px); box-shadow: 0 0 34px rgba(185,166,255,.7), 0 0 90px rgba(165,148,255,.3); }
  .go::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); animation: shine 3.6s ease-in-out infinite; }
  @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .go:disabled { opacity: .6; cursor: progress; }
  .error { text-align: center; color: var(--rose); font-size: 14px; margin-top: 12px; word-break: keep-all; }
  .error:empty { display: none; }

  /* ---------- Vortex overlay ---------- */
  #vortex { position: fixed; inset: 0; z-index: 50; background: #05040b; display: none; }
  #vortex.show { display: block; }
  #vortex canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #vortex .whisper { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; color: #d9d0ff; font-size: 17px; letter-spacing: 2px; padding: 0 20px; opacity: 0; transition: opacity .6s; text-shadow: 0 0 18px rgba(165,148,255,.8); word-break: keep-all; }
  #vortex .whisper.on { opacity: 1; }
  #vortex .flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #fff 0%, #fff6e2 30%, rgba(255,246,226,0) 70%); opacity: 0; pointer-events: none; }

  /* ---------- Portfolio card ---------- */
  #result { margin-top: 42px; scroll-margin-top: 16px; }
  .reveal { animation: dreamIn 1.4s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes dreamIn { from { opacity: 0; filter: blur(14px) brightness(1.8); transform: scale(1.03); } to { opacity: 1; filter: none; transform: none; } }
  .note { text-align: center; font-size: 13px; color: var(--text-3); margin-bottom: 14px; word-break: keep-all; }
  .gallery {
    position: relative; border-radius: 22px; padding: 30px 22px 24px; overflow: hidden;
    background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255, 214, 150, .16), transparent 70%), linear-gradient(180deg, #17110f 0%, #100b0c 100%);
    border: 1px solid rgba(226, 194, 122, .22); box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  .frame {
    position: relative; padding: 16px; border-radius: 3px;
    background: linear-gradient(135deg, #6b4914 0%, #e7c46c 18%, #9c7228 36%, #f5dc96 52%, #8a6220 70%, #d8b25a 86%, #6b4914 100%);
    box-shadow: 0 26px 50px rgba(0,0,0,.7), 0 4px 10px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,240,200,.55), inset 0 0 0 5px rgba(95,64,16,.55);
  }
  .frame::before { content: ""; position: absolute; inset: 6px; border: 2px dotted rgba(255, 236, 180, .55); pointer-events: none; }
  .canvas-wrap { position: relative; padding: 5px; background: #2a1c0e; box-shadow: inset 0 0 14px rgba(0,0,0,.9); }
  .canvas-wrap svg { display: block; width: 100%; height: auto; }
  .plaque {
    display: table; max-width: 92%; margin: 16px auto 0; padding: 6px 16px 5px; border-radius: 3px; text-align: center; color: #2b1c08;
    background: linear-gradient(180deg, #f1dc9c, #b9913f); box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .plaque b { display: block; font-size: 15px; letter-spacing: .5px; }
  .plaque span { font-size: 11.5px; opacity: .8; }
  .quote { text-align: center; font-size: clamp(21px, 5.4vw, 27px); line-height: 1.5; color: var(--gold-2); margin: 26px 4px 10px; word-break: keep-all; font-weight: 700; text-shadow: 0 0 24px rgba(226,194,122,.25); }
  .desc { text-align: center; color: #e6dccb; font-size: 15.5px; line-height: 1.85; margin: 0 6px; word-break: keep-all; }
  .tag { display: table; margin: 14px auto 0; font-size: 12.5px; padding: 3px 12px; border-radius: 999px; border: 1px solid rgba(226,194,122,.45); color: var(--gold); }
  .cast { margin: 22px 0 0; padding: 16px 0 0; border-top: 1px solid rgba(226,194,122,.2); list-style: none; display: grid; gap: 10px; }
  .cast li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; }
  .face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; border: 1px solid rgba(226,194,122,.5); background: radial-gradient(circle at 50% 40%, var(--tint, #4a3a28), #1a120c 85%); }
  .face svg { width: 100%; height: 100%; display: block; }
  .who { font-size: 15px; line-height: 1.45; }
  .who b { color: #fff; }
  .who span { color: #a89a86; font-size: 13px; margin-left: 4px; }
  .who em { display: block; font-style: normal; color: var(--gold); font-size: 13.5px; }
  .who em i { font-style: normal; color: #b9a98d; }
  .sig { text-align: center; margin-top: 18px; font-family: var(--latin); font-style: italic; color: #8f8170; font-size: 13px; letter-spacing: 1px; }

  .actions { display: grid; gap: 10px; margin-top: 16px; }
  .btn { height: 50px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--glass); cursor: pointer; transition: .2s; font-size: 15px; color: var(--text); }
  .btn:hover { border-color: var(--violet); background: var(--glass-2); }
  .btn.again { background: rgba(165,148,255,.16); border-color: var(--violet); font-weight: 700; }
  .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btn-grid .btn { font-size: 14px; padding: 0 6px; }
  .btn:disabled { opacity: .5; cursor: progress; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: rgba(30, 24, 60, .95); border: 1px solid var(--line-2); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; transition: .25s; z-index: 60; max-width: calc(100% - 32px); text-align: center; word-break: keep-all; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  footer { text-align: center; color: var(--text-3); font-size: 12.5px; margin-top: 46px; line-height: 1.9; word-break: keep-all; }

  @media (max-width: 520px) {
    .wrap { padding-top: 40px; }
    .panel { padding: 18px 14px; }
    .row { grid-template-columns: 1fr 1fr 34px; gap: 6px; }
    .del { width: 34px; }
    .ai-row { grid-template-columns: 1fr; }
    .gallery { padding: 22px 14px 20px; }
    .frame { padding: 11px; }
    .frame::before { inset: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stars, .fog, .orb-mark, .go::after { animation: none !important; }
    .reveal { animation-duration: .01s; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="stars"></div><div class="stars s2"></div><div class="fog f1"></div><div class="fog f2"></div></div>

<div class="wrap">
  <header>
    <div class="orb-mark" aria-hidden="true"></div>
    <div class="eyebrow">Past Life · Dream Archive</div>
    <h1>전생 체험관</h1>
    <p class="lead">함께 일하는 우리, 전생에선 어떤 사이였을까요?</p>
  </header>

  <section class="panel" aria-label="등장인물 입력">
    <p class="hint">팀명과 성명을 두 명 이상 적고, <b>전생 체험하기</b>를 눌러 주세요.</p>
    <div class="rows" id="rows"></div>
    <button class="add" id="addRow" type="button">＋ 한 명 더</button>
    <button class="go" id="go" type="button">전생 체험하기</button>
    <div class="error" id="error" role="alert"></div>

    <details class="ai">
      <summary><b>✦ OpenAI 키로 더 생생하게</b> (선택) · <span id="modeLabel">지금은 내장 이야기로 보여 드려요</span></summary>
      <div class="ai-body">
        <div class="ai-row">
          <input class="field" id="apiKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" aria-label="OpenAI API 키" />
          <input class="field" id="model" value="gpt-4o-mini" spellcheck="false" aria-label="모델" list="models" />
          <datalist id="models"><option value="gpt-4o-mini"></option><option value="gpt-4.1-mini"></option><option value="gpt-4o"></option><option value="gpt-5-mini"></option></datalist>
        </div>
        <label class="check"><input type="checkbox" id="rememberKey" /> 이 브라우저에만 저장</label>
        <div>키는 이 브라우저에서 OpenAI로만 전송돼요. 실패하면 내장 이야기로 대신 보여 드려요.</div>
      </div>
    </details>
  </section>

  <section id="result" aria-live="polite"></section>

  <footer>모든 전생은 재미로 지어낸 이야기예요 · 연애·궁합 없음 · 개인정보 불필요<br />입력한 이름은 이 브라우저와 직접 공유한 링크·이미지에만 담겨요.</footer>
</div>

<div id="vortex" aria-hidden="true"><canvas id="vcanvas"></canvas><div class="whisper" id="whisper"></div><div class="flash" id="flash"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   1. 한국어 조사
   ========================================================= */
const JOSA = { '은': ['은', '는'], '이': ['이', '가'], '을': ['을', '를'], '과': ['과', '와'], '으로': ['으로', '로'], '도': ['도', '도'], '의': ['의', '의'] };
function lastJong(word) {
  const s = String(word).replace(/[\s\)\]\}"'”’.!?~]+$/g, '');
  const ch = s.charAt(s.length - 1), code = ch.charCodeAt(0);
  if (code >= 0xac00 && code <= 0xd7a3) return (code - 0xac00) % 28;
  if (/[0-9]/.test(ch)) return { 0: 21, 1: 8, 2: 0, 3: 16, 4: 0, 5: 0, 6: 1, 7: 8, 8: 8, 9: 0 }[ch];
  if (/[lmn]/i.test(ch)) return /l/i.test(ch) ? 8 : 4;
  if (/[a-z]/i.test(ch)) return 0;
  return -1;
}
function josa(word, j) {
  const pair = JOSA[j]; if (!pair) return j;
  const jong = lastJong(word);
  if (jong === -1) return pair[0] === pair[1] ? pair[0] : `${pair[0]}(${pair[1]})`;
  if (pair[0] === '으로') return (jong === 0 || jong === 8) ? '로' : '으로';
  return jong > 0 ? pair[0] : pair[1];
}
const fill = (tpl, v) => tpl.replace(/\{(\w+)(?:\|([^}]+))?\}/g, (_, k, j) => { const s = v[k] ?? ''; return j ? s + josa(s, j) : s; });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* =========================================================
   2. 팀 성격 → 전생의 수식어
   ========================================================= */
const ARCHETYPES = [
  { key: 'sales', test: /영업|세일즈|sales|\bbd\b|사업개발|파트너|제휴|어카운트|비즈니스/, color: '#8a5a3b', prop: 'pouch', hat: 'cap', ep: ['넓은 발', '신의', '협상력'] },
  { key: 'qa', test: /\bqa\b|품질|테스트|test|검수|검증|quality/, color: '#7d6b8f', prop: 'magnifier', ep: ['빈틈없는 눈', '꼼꼼함', '끈기'] },
  { key: 'data', test: /데이터|data|분석|analytic|\bai\b|\bml\b|머신러닝|인공지능|리서치|research|인사이트|\bbi\b|통계/, color: '#3f5a7a', prop: 'telescope', ep: ['밝은 눈', '별을 읽는 눈', '관찰력'] },
  { key: 'infra', test: /인프라|infra|devops|\bsre\b|보안|security|네트워크|network|\bit\b|클라우드|cloud|정보보호|전산/, color: '#5f666e', prop: 'shield', ep: ['든든함', '뚝심', '철벽 수비'] },
  { key: 'sound', test: /사운드|sound|음악|오디오|audio|bgm|작곡|음향/, color: '#a3574a', prop: 'note', hat: 'beret', ep: ['장단 감각', '밝은 귀'] },
  { key: 'writing', test: /시나리오|스토리|라이터|writer|작가|에디터|editor|카피|copy|편집|번역|로컬|locali|문서|퍼블리싱|출판/, color: '#7a6248', prop: 'quill', hat: 'beret', ep: ['글솜씨', '말맛'] },

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeRng(seed) { const r = mulberry32(seed >>> 0); return { pick: arr => arr[Math.floor(r() * arr.length)], shuffle: arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; } }; }
const teamLabel = t => (t && t.trim()) ? t.trim() : '소속 미정';

function generateBuiltin(people, seed, avoidTitle) {
  const rng = makeRng(seed);
  const fresh = SCENARIOS.filter(s => s.title !== avoidTitle);
  const sc = rng.pick(fresh);
  const extras = rng.shuffle(sc.extras).concat(rng.shuffle(GENERIC_EXTRAS));
  const cast = people.map((p, i) => {
    const arc = detectArchetype(p.team);
    const slot = i === 0 ? sc.roleA : i === 1 ? sc.roleB : extras[(i - 2) % extras.length];
    return { team: teamLabel(p.team), name: p.name.trim(), arc: arc.key, role: slot, trait: rng.pick(arc.ep) };
  });
  const v = { a: cast[0].name, b: cast[1].name };
  return { title: sc.title, era: sc.era, scene: sc.scene, tone: sc.tone, tag: sc.tag, quote: sc.quote, desc: fill(sc.desc, v), people: cast, source: 'builtin' };
}

const SYSTEM_PROMPT = `너는 '전생 체험관'의 이야기꾼이다. 회사 동료들의 (팀명, 이름) 목록을 받아, 이들이 전생에 어떤 사이였는지 고전 명화 한 폭처럼 보여 준다. 짧고 강렬해야 한다.
[형식] 영화 포스터의 카피처럼: 인상적인 대사 한 줄(플레이버 텍스트) + 그 장면을 풀어 주는 설명 1~2문장. 길게 늘이지 않는다.
[핵심] 처음 두 사람이 인연의 중심이고, 나머지는 그 장면에 함께 있던 인물이다. 각 팀의 결(예: 개발팀=묵묵함·정밀함, 디자이너팀=색채·미감)을 전생 역할의 수식어로 짧게 녹인다. 진중한 이야기와 유쾌한 이야기 중 하나를 고르되 매번 새롭게.
[금지] 연애·궁합·커플·설렘 등 로맨스 요소 / 나이·성별·외모·연락처 등 개인정보·민감정보의 언급이나 추정, 성별을 가정한 호칭 / 업무 능력·성향을 비하하거나 조롱하는 표현.
이름과 팀명은 입력 그대로 쓰고, 반드시 JSON 객체 하나만 출력한다.`;

async function generateAI(people, { apiKey, model, avoidTitle }) {
  const user = `등장인물(순서대로): ${JSON.stringify(people.map(p => ({ team: teamLabel(p.team), name: p.name.trim() })))}
${avoidTitle ? `직전 결과("${avoidTitle}")와는 완전히 다른 시대·장소·관계로.` : ''}
그림 배경은 가장 어울리는 하나를 "scene"에: battle(전장·결투), clock(안개 도시·시계탑), palace(동양 궁궐·한옥·등불 거리), snow(설원·눈의 왕국), desert(사막·오아시스), library(바다 위 섬·탑), sea(항구·배).
JSON: {"title": "명화 제목(12자 이내)", "era": "장소 · 몇 년 전 (20자 이내)", "scene": "...", "tone": "serious 또는 funny", "tag": "관계 변화 꼬리표(예: 적국의 전사 → 평생의 맞수, 18자 이내)",
 "quote": "“ ”로 감싼 강렬한 대사 한 줄(22자 이내)", "desc": "장면 설명 1~2문장(합쳐서 90자 이내)",
 "people": [{"name": "이름", "team": "팀명", "role": "전생 신분(12자 이내, 예: 북국의 전사)", "trait": "그 팀의 결을 담은 짧은 명사구(8자 이내, 예: 묵묵함, 남다른 색감)"}]}`;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 40000);
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST', signal: controller.signal,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` },
      body: JSON.stringify({ model, response_format: { type: 'json_object' }, messages: [{ role: 'system', content: SYSTEM_PROMPT }, { role: 'user', content: user }] })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
    const o = JSON.parse(data.choices?.[0]?.message?.content || '{}');
    if (!o.title || !o.quote || !o.desc) throw new Error('응답 형식이 올바르지 않아요');
    const list = Array.isArray(o.people) ? o.people : [];
    return {
      title: String(o.title), era: String(o.era || ''), scene: SCENE_KEYS.includes(o.scene) ? o.scene : 'clock', tone: o.tone === 'funny' ? 'funny' : 'serious',
      tag: String(o.tag || ''), quote: String(o.quote), desc: String(o.desc), source: 'ai', model,
      people: people.map((p, i) => { const hit = list.find(x => x && x.name === p.name.trim()) || list[i] || {}; const arc = detectArchetype(p.team); return { team: teamLabel(p.team), name: p.name.trim(), arc: arc.key, role: String(hit.role || '그 자리에 있던 동행'), trait: String(hit.trait || arc.ep[0]) }; })
    };
  } catch (e) { throw e.name === 'AbortError' ? new Error('응답 시간이 초과됐어요') : e; }
  finally { clearTimeout(timer); }
}

const MAX = 8;
const state = { rows: [], uid: 0, busy: false, result: null, attempt: 0, sig: '' };
const $ = s => document.querySelector(s);
const newRow = (team = '', name = '') => ({ id: ++state.uid, team, name });

function renderRows() {
  const box = $('#rows');
  box.innerHTML = state.rows.map((r, i) => `<div class="row" data-id="${r.id}">
      <input class="field" data-k="team" maxlength="20" placeholder="팀명" value="${esc(r.team)}" aria-label="${i + 1}번째 팀명" />
      <input class="field" data-k="name" maxlength="20" placeholder="성명" value="${esc(r.name)}" aria-label="${i + 1}번째 성명" />
      <button class="del" type="button" aria-label="${i + 1}번째 사람 지우기" ${state.rows.length <= 2 ? 'disabled' : ''}>×</button></div>`).join('');
  box.querySelectorAll('.row').forEach(el => {
    const r = state.rows.find(x => x.id === +el.dataset.id);
    el.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => { r[inp.dataset.k] = inp.value; $('#error').textContent = ''; });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); experience(false); } });
    });
    el.querySelector('.del').addEventListener('click', () => { state.rows = state.rows.filter(x => x.id !== r.id); renderRows(); });
  });
  $('#addRow').disabled = state.rows.length >= MAX;
  $('#addRow').textContent = state.rows.length >= MAX ? `최대 ${MAX}명까지 함께할 수 있어요` : '＋ 한 명 더';
}

const SENSITIVE = [/\d{2,3}[-.\s]?\d{3,4}[-.\s]?\d{4}/, /[\w.+-]+@[\w-]+\.[\w.]+/, /\d{6}[-\s]?[1-4]\d{6}/];
function validate() {
  const people = state.rows.filter(r => r.name.trim() || r.team.trim());
  if (people.some(p => !p.name.trim())) return { error: '성명이 비어 있는 줄이 있어요.' };
  if (people.length < 2) return { error: '전생의 인연은 두 사람부터 이어져요. 두 명 이상 적어 주세요.' };
  if (people.some(p => SENSITIVE.some(re => re.test(p.team + ' ' + p.name)))) return { error: '연락처·이메일 같은 개인정보로 보이는 내용은 적을 수 없어요.' };
  const names = people.map(p => p.name.trim());
  if (new Set(names).size !== names.length) return { error: '같은 성명이 두 번 적혀 있어요.' };
  return { people };
}

  const box = $('#vortex'), cv = $('#vcanvas'), ctx = cv.getContext('2d'), wh = $('#whisper'), flash = $('#flash');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = W / 2, cy = H / 2, R = Math.hypot(W, H) / 2;
  const colors = ['#fff6d8', '#d9ceff', '#b9a6ff', '#f3a6c0', '#ffd98a'];
  const parts = Array.from({ length: reduce ? 0 : 520 }, () => ({ a: Math.random() * Math.PI * 2, r: R * (0.35 + Math.random() * 0.9), s: 0.4 + Math.random() * 1.6, c: colors[(Math.random() * colors.length) | 0], w: 0.8 + Math.random() * 1.8 }));
  const lines = ['눈을 감고, 숨을 천천히 쉬어 보세요…', `${count}개의 기억이 같은 곳을 향해 흘러가요…`, '아주 오래전 어느 날, 한 장면이 떠오릅니다…'];
  box.classList.add('show'); flash.style.transition = 'none'; flash.style.opacity = 0;
  ctx.fillStyle = '#05040b'; ctx.fillRect(0, 0, W, H);
  document.body.style.overflow = 'hidden';
  let li = 0; wh.textContent = lines[0]; wh.classList.add('on');
  const lineTimer = setInterval(() => { wh.classList.remove('on'); setTimeout(() => { li = Math.min(lines.length - 1, li + 1); wh.textContent = lines[li]; wh.classList.add('on'); }, 450); }, 1300);
  const t0 = performance.now(); let raf, done = false;
  const MIN = reduce ? 600 : 3600;
  const frame = now => {
    const pull = Math.min(1, (now - t0) / MIN);
    ctx.fillStyle = `rgba(5,4,11,${0.16 + pull * 0.1})`; ctx.fillRect(0, 0, W, H);
    const core = 18 + pull * 70;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, core * 3);

      const x0 = cx + Math.cos(p.a) * p.r, y0 = cy + Math.sin(p.a) * p.r * 0.78;
      p.a += (0.012 + 1.6 / (p.r + 30)) * p.s * (1 + pull * 2.5);
      p.r *= 1 - (0.006 + pull * 0.03) * p.s;

  return Promise.all([work, minWait]).then(([res]) => new Promise(resolve => {

    flash.style.transition = `opacity ${reduce ? 150 : 650}ms ease-in`; flash.style.opacity = 1;
    setTimeout(() => {
      cleanup(); resolve(res);
      box.style.transition = 'opacity .9s ease'; box.style.opacity = 0;
      setTimeout(() => { box.classList.remove('show'); box.style.opacity = ''; box.style.transition = ''; document.body.style.overflow = ''; }, 900);
    }, reduce ? 150 : 700);
  }), err => { cleanup(); box.classList.remove('show'); document.body.style.overflow = ''; throw err; });
}

/* =========================================================
   9. 체험 흐름 & 포트폴리오 카드
   ========================================================= */
async function experience(again) {
  if (state.busy) return;
  const { people, error } = validate();
  if (error) { $('#error').textContent = error; return; }
  const sig = people.map(p => normTeam(p.team) + '/' + p.name.trim()).join('|');
  state.attempt = (again || sig === state.sig) ? state.attempt + 1 : 0;
  state.sig = sig;
  const apiKey = $('#apiKey').value.trim(), model = $('#model').value.trim() || 'gpt-4o-mini';
  const avoid = state.result ? state.result.title : '';
  state.busy = true; $('#go').disabled = true;
  let notice = '';
  const work = (async () => {
    if (apiKey) {
      try { return await generateAI(people, { apiKey, model, avoidTitle: avoid }); }
      catch (e) { notice = `AI 연결에 실패해 내장 이야기로 보여 드려요 (${e.message})`; }
    }
    return generateBuiltin(people, hashStr(sig) + state.attempt * 7919 + ((Math.random() * 1e6) | 0), avoid);
  })();
  try { const res = await vortex(work, people.length); state.result = res; renderResult(res, { notice }); }
  finally { state.busy = false; $('#go').disabled = false; }
}

function renderResult(r, { notice = '', shared = false } = {}) {
  const box = $('#result');
  box.innerHTML = `<div class="reveal">
    ${shared ? '<div class="note">누군가 공유한 전생 한 폭이에요 · 위에서 우리 팀의 전생도 체험해 보세요</div>' : ''}
    ${notice ? `<div class="note">${esc(notice)}</div>` : ''}
    <article class="gallery" id="card">
      <div class="frame"><div class="canvas-wrap">${paintingSvg(r.scene, r.tone, r.people, r.title)}</div></div>
      <div class="plaque"><b>「${esc(r.title)}」</b><span>${esc(r.era)}</span></div>
      <p class="quote">${esc(r.quote)}</p>
      <p class="desc">${esc(r.desc)}</p>
      ${r.tag ? `<div class="tag">${esc(r.tag)}</div>` : ''}
      <ul class="cast">${r.people.map(p => `<li><div class="face" style="--tint:${arcByKey(p.arc).color}">${portraitSvg(p)}</div>
        <div class="who"><b>${esc(p.name)}</b><span>${esc(p.team)}</span><em>${esc(p.role)}${p.trait ? ` <i>· ${esc(p.trait)}</i>` : ''}</em></div></li>`).join('')}</ul>
      <div class="sig">Past Life · Dream Archive</div>
    </article>
    <div class="actions">
      <button class="btn again" id="again" type="button">↻ 다른 전생도 체험하기</button>
      <div class="btn-grid">
        <button class="btn" id="saveImg" type="button">이미지 저장</button>
        <button class="btn" id="copyLink" type="button">링크 공유</button>
        <button class="btn" id="copyText" type="button">텍스트 복사</button>
      </div>
    </div>
    ${r.source === 'ai' ? `<div class="note" style="margin-top:12px">AI 이야기 · ${esc(r.model || '')}</div>` : ''}
  </div>`;
  $('#again').addEventListener('click', () => experience(true));
  $('#saveImg').addEventListener('click', e => saveImage(r, e.currentTarget));
  $('#copyText').addEventListener('click', () => copyText(resultText(r), '텍스트를 복사했어요'));
  $('#copyLink').addEventListener('click', async () => {
    const url = await shareUrl(r);
    if (navigator.share && matchMedia('(pointer: coarse)').matches) navigator.share({ title: `전생 체험 · ${r.title}`, text: `${r.quote} ${r.desc}`, url }).catch(() => {});
    else copyText(url, '링크를 복사했어요. 받은 사람은 이 그림을 그대로 볼 수 있어요');
  });
  setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'start' }), shared ? 0 : 120);
}

function resultText(r) {
  return [`🖼 「${r.title}」 — ${r.era}`, '', r.quote, r.desc, r.tag ? `(${r.tag})` : '', '',
    ...r.people.map(p => `· ${p.name} (${p.team}) — ${p.role}${p.trait ? ` · ${p.trait}` : ''}`), '', `전생 체험관 · ${location.origin}${location.pathname}`].filter((l, i, a) => !(l === '' && a[i - 1] === '')).join('\n').trim();
}

/* ---------- 한 장짜리 이미지 (PNG) ---------- */
function loadSvg(svg, w = 800, h = 520) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img); img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', `<svg width="${w}" height="${h}" `));
  });
}
function wrap(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach(par => {
    let line = '';
    for (const word of par.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (ctx.measureText(t).width <= maxW) { line = t; continue; }
      if (line) out.push(line);
      line = word;
      while (ctx.measureText(line).width > maxW) { let k = line.length; while (k > 1 && ctx.measureText(line.slice(0, k)).width > maxW) k--; out.push(line.slice(0, k)); line = line.slice(k); }
    }
    out.push(line);
  });
  return out;
}
async function saveImage(r, btn) {
  btn.disabled = true;
  try {
    try { await document.fonts.ready; } catch {}
    const W = 1080, P = 90, serif = '"Gowun Batang", serif', latin = '"Cormorant Garamond", serif';
    const painting = await loadSvg(paintingSvg(r.scene, r.tone, r.people, r.title));
    const faces = await Promise.all(r.people.map(p => loadSvg(portraitSvg(p), 136, 136).catch(() => null)));
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
    const layout = draw => {
      let y = 96;
      const fw = W - P * 2, fh = Math.round(fw * 260 / 400) + 64;
      if (draw) {
        const g = ctx.createLinearGradient(P, y, P + fw, y + fh);
        [['0', '#6b4914'], ['.18', '#e7c46c'], ['.36', '#9c7228'], ['.52', '#f5dc96'], ['.7', '#8a6220'], ['.86', '#d8b25a'], ['1', '#6b4914']].forEach(([o, c]) => g.addColorStop(+o, c));
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 24; ctx.fillStyle = g; ctx.fillRect(P, y, fw, fh); ctx.restore();
        ctx.strokeStyle = 'rgba(255,236,180,.55)'; ctx.setLineDash([3, 5]); ctx.lineWidth = 3; ctx.strokeRect(P + 12, y + 12, fw - 24, fh - 24); ctx.setLineDash([]);
        ctx.fillStyle = '#2a1c0e'; ctx.fillRect(P + 26, y + 26, fw - 52, fh - 52);
        ctx.drawImage(painting, P + 32, y + 32, fw - 64, fh - 64);
      }
      y += fh + 26;
      ctx.font = `700 30px ${serif}`;
      const pw = Math.max(ctx.measureText(`「${r.title}」`).width, (ctx.font = `400 21px ${serif}`, ctx.measureText(r.era).width)) + 60;
      if (draw) {
        const pg = ctx.createLinearGradient(0, y, 0, y + 84); pg.addColorStop(0, '#f1dc9c'); pg.addColorStop(1, '#b9913f');
        ctx.fillStyle = pg; ctx.fillRect(W / 2 - pw / 2, y, pw, 84);
        ctx.fillStyle = '#2b1c08'; ctx.textAlign = 'center';
        ctx.font = `700 30px ${serif}`; ctx.fillText(`「${r.title}」`, W / 2, y + 40);
        ctx.font = `400 21px ${serif}`; ctx.fillText(r.era, W / 2, y + 70);
      }
      y += 84 + 70;
      ctx.textAlign = 'center';
      ctx.font = `700 46px ${serif}`;
      wrap(ctx, r.quote, W - P * 2).forEach(l => { if (draw) { ctx.fillStyle = '#f3dfa6'; ctx.fillText(l, W / 2, y); } y += 66; });
      y += 8;
      ctx.font = `400 30px ${serif}`;
      wrap(ctx, r.desc, W - P * 2 - 20).forEach(l => { if (draw) { ctx.fillStyle = '#e6dccb'; ctx.fillText(l, W / 2, y); } y += 50; });
      if (r.tag) {
        y += 14; ctx.font = `400 24px ${serif}`;
        const tw = ctx.measureText(r.tag).width + 44;
        if (draw) { ctx.strokeStyle = 'rgba(226,194,122,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, y - 32, tw, 46, 23); ctx.stroke(); ctx.fillStyle = '#e2c27a'; ctx.fillText(r.tag, W / 2, y); }
        y += 40;
      }
      y += 34;
      if (draw) { ctx.strokeStyle = 'rgba(226,194,122,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(P, y); ctx.lineTo(W - P, y); ctx.stroke(); }
      y += 40;
      ctx.textAlign = 'left';
      r.people.forEach((p, i) => {
        if (draw) {
          ctx.save(); ctx.beginPath(); ctx.arc(P + 34, y + 30, 34, 0, Math.PI * 2); ctx.fillStyle = '#2a1d12'; ctx.fill(); ctx.clip();
          if (faces[i]) ctx.drawImage(faces[i], P, y - 4, 68, 68);
          ctx.restore(); ctx.strokeStyle = 'rgba(226,194,122,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(P + 34, y + 30, 34, 0, Math.PI * 2); ctx.stroke();
          ctx.font = `700 28px ${serif}`; ctx.fillStyle = '#ffffff'; ctx.fillText(p.name, P + 90, y + 22);
          const nw = ctx.measureText(p.name).width;
          ctx.font = `400 22px ${serif}`; ctx.fillStyle = '#a89a86'; ctx.fillText(p.team, P + 100 + nw, y + 22);
          ctx.font = `400 24px ${serif}`; ctx.fillStyle = '#e2c27a'; ctx.fillText(p.role, P + 90, y + 58);
          if (p.trait) { const rw = ctx.measureText(p.role).width; ctx.fillStyle = '#b9a98d'; ctx.fillText(` · ${p.trait}`, P + 90 + rw, y + 58); }
        }
        y += 92;
      });
      y += 30;
      ctx.textAlign = 'center'; ctx.font = `italic 500 26px ${latin}`;
      if (draw) { ctx.fillStyle = '#8f8170'; ctx.fillText('Past Life · Dream Archive', W / 2, y); ctx.font = `400 20px ${serif}`; ctx.fillText(location.host || '전생 체험관', W / 2, y + 34); }
      return y + 80;
    };
    cv.width = W; cv.height = 10;
    const H = Math.ceil(layout(false));
    cv.width = W; cv.height = H;
    const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#17110f'); bg.addColorStop(1, '#0d090a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const spot = ctx.createRadialGradient(W / 2, 0, 0, W / 2, 0, W * .8); spot.addColorStop(0, 'rgba(255,214,150,.18)'); spot.addColorStop(1, 'rgba(255,214,150,0)');
    ctx.fillStyle = spot; ctx.fillRect(0, 0, W, H);
    layout(true);
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if (!blob) throw new Error('blob');
    const file = new File([blob], `전생체험_${r.title.replace(/[\\/:*?"<>|\s]+/g, '_')}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia('(pointer: coarse)').matches) {
      await navigator.share({ files: [file], title: `전생 체험 · ${r.title}` }).catch(() => {});
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      toast('한 장짜리 이미지로 저장했어요');
    }
  } catch { toast('이미지를 만들지 못했어요. 링크 공유를 이용해 주세요'); }
  finally { btn.disabled = false; }
}

/* ---------- 공유 링크 ---------- */
const b64u = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window) { try { const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate')); return 'z' + b64u(new Uint8Array(await new Response(st).arrayBuffer())); } catch {} }
  return 'u' + b64u(bytes);
}
async function unpack(str) {
  let bytes = unb64u(str.slice(1));
  if (str[0] === 'z') { const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate')); bytes = new Uint8Array(await new Response(st).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function shareUrl(r) {
  const o = { v: 4, t: r.title, e: r.era, k: r.scene, n: r.tone, g: r.tag, q: r.quote, d: r.desc, o: r.source, m: r.model || '', p: r.people.map(p => [p.team, p.name, p.arc, p.role, p.trait || '']) };
  return `${location.origin}${location.pathname}#r=${await pack(o)}`;
}
function fromShared(o) {
  if (!o || o.v !== 4 || !Array.isArray(o.p) || !o.t) return null;
  const S = x => String(x ?? '');
  return { title: S(o.t), era: S(o.e), scene: SCENE_KEYS.includes(o.k) ? o.k : 'clock', tone: o.n === 'funny' ? 'funny' : 'serious', tag: S(o.g), quote: S(o.q), desc: S(o.d), source: o.o === 'ai' ? 'ai' : 'builtin', model: S(o.m),
    people: o.p.slice(0, MAX).map(([team, name, arc, role, trait]) => ({ team: S(team), name: S(name), arc: S(arc), role: S(role), trait: S(trait) })) };
}

/* ---------- 공통 ---------- */
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg); } catch { toast('복사에 실패했어요'); }
    ta.remove();
  }
}
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} } };
function initKey() {
  const K = 'pastlife.openai.key', M = 'pastlife.openai.model';
  if (ls.get(K)) { $('#apiKey').value = ls.get(K); $('#rememberKey').checked = true; }
  if (ls.get(M)) $('#model').value = ls.get(M);
  const sync = () => {
    if ($('#rememberKey').checked && $('#apiKey').value.trim()) { ls.set(K, $('#apiKey').value.trim()); ls.set(M, $('#model').value.trim()); } else { ls.del(K); ls.del(M); }
    $('#modeLabel').textContent = $('#apiKey').value.trim() ? 'AI가 새로 그려 드려요' : '지금은 내장 이야기로 보여 드려요';
  };
  ['input', 'change'].forEach(ev => { $('#apiKey').addEventListener(ev, sync); $('#model').addEventListener(ev, sync); });
  $('#rememberKey').addEventListener('change', sync); sync();
}

async function init() {
  state.rows = [newRow(), newRow()];
  initKey();
  $('#addRow').addEventListener('click', () => { if (state.rows.length < MAX) { state.rows.push(newRow()); renderRows(); const rs = $('#rows').querySelectorAll('.row'); rs[rs.length - 1].querySelector('input').focus(); } });
  $('#go').addEventListener('click', () => experience(false));
  const m = location.hash.match(/#r=([\w-]+)/);
  if (m) {
    try {
      const r = fromShared(await unpack(m[1]));
      if (r) { state.rows = r.people.map(p => newRow(p.team === '소속 미정' ? '' : p.team, p.name)); renderRows(); state.result = r; renderResult(r, { shared: true }); history.replaceState(null, '', location.pathname); return; }
    } catch {}
  }
  renderRows();
}
init();
