<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>전생 체험관</title>
<meta name="description" content="팀명과 이름을 적고 전생 체험하기를 누르면, 우리가 전생에 어떤 사이로 만났는지 한 장면과 함께 풀어 드려요." />
<meta property="og:title" content="전생 체험관 — 우리는 전생에 어떤 사이였을까" />
<meta property="og:description" content="팀명과 이름만으로 보는, 동료들과의 전생 인연 한 장면." />
<meta name="theme-color" content="#07060f" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff6d8'/%3E%3Cstop offset='.45' stop-color='%23b9a6ff'/%3E%3Cstop offset='1' stop-color='%2307060f'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2307060f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='url(%23g)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07060f;
    --bg-2: #0e0c1f;
    --glass: rgba(255, 255, 255, .045);
    --glass-2: rgba(255, 255, 255, .08);
    --line: rgba(205, 190, 255, .16);
    --line-2: rgba(205, 190, 255, .3);
    --text: #ece7f8;
    --text-2: #b8b0d4;
    --text-3: #857da3;
    --violet: #a594ff;
    --violet-2: #c9bcff;
    --gold: #ead29a;
    --rose: #f3a6c0;
    --glow: 0 0 24px rgba(165, 148, 255, .45), 0 0 60px rgba(165, 148, 255, .18);
    --serif: "Gowun Batang", "AppleMyungjo", serif;
    --latin: "Cormorant Garamond", "Gowun Batang", serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-family: var(--serif); font-size: 16px; line-height: 1.75;
    background: radial-gradient(ellipse 90% 60% at 50% -10%, #241c4d 0%, transparent 60%), radial-gradient(ellipse 70% 50% at 100% 100%, #2a1235 0%, transparent 60%), var(--bg);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- Dream sky ---------- */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .stars { position: absolute; inset: -50%; background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 120px 80px, #d8ccff, transparent),
      radial-gradient(1.5px 1.5px at 200px 160px, #fff8e0, transparent), radial-gradient(1px 1px at 60px 210px, #fff, transparent),
      radial-gradient(1px 1px at 260px 40px, #cfc3ff, transparent), radial-gradient(1.2px 1.2px at 300px 240px, #fff, transparent);
    background-size: 320px 280px; opacity: .55; animation: drift 180s linear infinite; }
  .stars.s2 { background-size: 520px 460px; opacity: .35; animation-duration: 260s; animation-direction: reverse; }
  @keyframes drift { to { transform: translate3d(-320px, -280px, 0); } }
  .fog { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(70px); opacity: .32; }
  .fog.f1 { background: #4b3aa8; left: -25vmax; top: 10vh; animation: float1 26s ease-in-out infinite alternate; }
  .fog.f2 { background: #8a2f6f; right: -30vmax; top: 50vh; opacity: .22; animation: float2 32s ease-in-out infinite alternate; }
  @keyframes float1 { to { transform: translate(14vmax, -8vmax) scale(1.1); } }
  @keyframes float2 { to { transform: translate(-12vmax, -14vmax) scale(.9); } }

  .wrap { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 56px 16px 90px; }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: 30px; }
  .eyebrow { font-family: var(--latin); letter-spacing: 6px; font-size: 13px; color: var(--violet-2); text-transform: uppercase; }
  h1 { font-weight: 700; font-size: clamp(34px, 8vw, 46px); margin: 10px 0 6px; letter-spacing: -1px;
    background: linear-gradient(180deg, #fff 20%, #c9bcff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(165,148,255,.25); }
  .lead { color: var(--text-2); margin: 0; word-break: keep-all; }
  .orb-mark { width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #fff6d8 0%, #b9a6ff 40%, rgba(165,148,255,0) 72%); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.12); filter: brightness(1.2); } }

  /* ---------- Panel ---------- */
  .panel { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 22px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .hint { text-align: center; font-size: 13.5px; color: var(--text-3); margin: 0 0 16px; word-break: keep-all; }
  .rows { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 38px; gap: 8px; align-items: start; }
  .field { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(10, 8, 25, .55); outline: none; transition: .2s; font-size: 16px; }
  .field::placeholder { color: var(--text-3); }
  .field:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(165,148,255,.18), var(--glow); }
  .del { width: 38px; height: 48px; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--text-3); cursor: pointer; font-size: 18px; }
  .del:hover { color: var(--rose); border-color: var(--line); }
  .del:disabled { opacity: .25; cursor: default; }
  .trait { grid-column: 1 / 3; font-size: 12px; color: var(--gold); opacity: .8; margin: -4px 0 0 4px; min-height: 0; word-break: keep-all; }
  .trait:empty { display: none; }
  .add { width: 100%; margin-top: 12px; height: 44px; border-radius: 12px; border: 1px dashed var(--line-2); background: transparent; color: var(--text-2); cursor: pointer; transition: .2s; }
  .add:hover { border-color: var(--violet); color: var(--violet-2); }
  .add:disabled { opacity: .4; cursor: default; }

  .tone { display: flex; justify-content: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .tone button { border: 1px solid var(--line); background: transparent; color: var(--text-2); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; cursor: pointer; transition: .2s; }
  .tone button[aria-pressed="true"] { background: rgba(165,148,255,.18); border-color: var(--violet); color: #fff; }
  .tone-label { width: 100%; text-align: center; font-size: 12px; color: var(--text-3); letter-spacing: 2px; }

  details.ai { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 13.5px; color: var(--text-3); }
  details.ai summary { cursor: pointer; list-style: none; text-align: center; }
  details.ai summary::-webkit-details-marker { display: none; }
  details.ai summary b { color: var(--violet-2); font-weight: 400; }
  .ai-body { display: grid; gap: 8px; margin-top: 12px; }
  .ai-row { display: grid; grid-template-columns: 1fr 140px; gap: 8px; }
  .ai-row .field { height: 42px; font-size: 14px; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
  .check input { accent-color: var(--violet); }

  .go {
    display: block; width: 100%; margin-top: 22px; height: 62px; border: 0; border-radius: 999px; cursor: pointer; position: relative; overflow: hidden;
    font-size: 19px; font-weight: 700; letter-spacing: 2px; color: #0b0918;
    background: radial-gradient(circle at 50% 0%, #fffaf0 0%, #d9ceff 45%, #a594ff 100%); box-shadow: var(--glow); transition: transform .2s, box-shadow .2s;
  }
  .go:hover { transform: translateY(-1px); box-shadow: 0 0 34px rgba(185,166,255,.7), 0 0 90px rgba(165,148,255,.3); }
  .go::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); animation: shine 3.6s ease-in-out infinite; }
  @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .go:disabled { opacity: .6; cursor: progress; }
  .error { text-align: center; color: var(--rose); font-size: 14px; margin-top: 12px; word-break: keep-all; }
  .error:empty { display: none; }

  /* ---------- Vortex overlay ---------- */
  #vortex { position: fixed; inset: 0; z-index: 50; background: #05040b; display: none; }
  #vortex.show { display: block; }
  #vortex canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #vortex .whisper { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; color: #d9d0ff; font-size: 17px; letter-spacing: 2px; padding: 0 20px; opacity: 0; transition: opacity .6s; text-shadow: 0 0 18px rgba(165,148,255,.8); word-break: keep-all; }
  #vortex .whisper.on { opacity: 1; }
  #vortex .flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #fff 0%, #f1ecff 30%, rgba(241,236,255,0) 70%); opacity: 0; pointer-events: none; }

  /* ---------- Result ---------- */
  #result { margin-top: 42px; scroll-margin-top: 20px; }
  .reveal { animation: dreamIn 1.4s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes dreamIn { from { opacity: 0; filter: blur(14px) brightness(1.8); transform: scale(1.03); } to { opacity: 1; filter: none; transform: none; } }
  .shared-note { text-align: center; font-size: 13px; color: var(--text-3); margin-bottom: 14px; }
  .snap { position: relative; border-radius: 26px; overflow: hidden; border: 1px solid var(--line-2); box-shadow: 0 0 0 6px rgba(165,148,255,.05), 0 30px 80px rgba(0,0,0,.6), 0 0 80px rgba(165,148,255,.15); }
  .snap svg { display: block; width: 100%; height: auto; filter: saturate(.92); }
  .snap::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 50%, rgba(5,4,12,.55) 100%); }
  .snap .mote { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff6d8; box-shadow: 0 0 10px #fff6d8, 0 0 20px #b9a6ff; animation: mote 6s ease-in-out infinite; opacity: 0; }
  @keyframes mote { 0% { opacity: 0; transform: translateY(10px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-60px); } }
  .caption { text-align: center; font-style: italic; color: var(--text-2); margin: 14px 8px 0; word-break: keep-all; font-size: 15px; }
  .caption::before { content: "📸 "; font-style: normal; }

  .r-head { text-align: center; margin: 30px 0 18px; }
  .chips { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 12.5px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--text-2); }
  .chip.tag { border-color: rgba(234,210,154,.5); color: var(--gold); }
  .r-title { font-size: clamp(25px, 6vw, 32px); font-weight: 700; margin: 12px 0 0; line-height: 1.35; word-break: keep-all; color: #fff; text-shadow: 0 0 30px rgba(165,148,255,.35); }

  .summary { background: linear-gradient(180deg, rgba(165,148,255,.14), rgba(165,148,255,.05)); border: 1px solid rgba(165,148,255,.35); border-radius: 18px; padding: 18px 20px; margin-bottom: 22px; }
  .label { font-family: var(--latin); letter-spacing: 4px; font-size: 12.5px; color: var(--violet-2); text-transform: uppercase; margin: 0 0 8px; }
  .summary p { margin: 0; font-size: 16.5px; line-height: 1.85; word-break: keep-all; }

  .people { display: grid; gap: 12px; margin-bottom: 22px; }
  .person { display: grid; grid-template-columns: 64px 1fr; gap: 14px; background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .portrait { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 40%, var(--tint, #3a3170), #151230 80%); border: 1px solid var(--line-2); box-shadow: 0 0 18px rgba(165,148,255,.25); }
  .portrait svg { width: 100%; height: 100%; display: block; }
  .p-name { font-weight: 700; font-size: 16.5px; }
  .p-name span { font-weight: 400; color: var(--text-3); font-size: 13px; margin-left: 6px; }
  .p-role { color: var(--gold); font-size: 14px; margin: 2px 0 6px; word-break: keep-all; line-height: 1.55; }
  .p-detail { color: var(--text-2); font-size: 14.5px; margin: 0; word-break: keep-all; line-height: 1.75; }

  details.story { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px; margin-bottom: 18px; }
  details.story summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details.story summary::-webkit-details-marker { display: none; }
  details.story summary .label { margin: 0; }
  details.story summary .more { font-size: 13px; color: var(--text-3); white-space: nowrap; }
  details.story[open] summary .more { color: var(--violet-2); }
  .story-body p { margin: 12px 0 0; word-break: keep-all; color: var(--text); line-height: 1.95; }
  .teaser { color: var(--text-2); font-size: 14px; margin-top: 6px; word-break: keep-all; }
  details.story[open] .teaser { display: none; }
  .now { text-align: center; color: var(--gold); font-size: 15.5px; margin: 0 6px 26px; word-break: keep-all; }
  .now::before { content: "✦ 현생에서 — "; color: var(--text-3); }

  .actions { display: grid; gap: 10px; }
  .btn { height: 50px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--glass); cursor: pointer; transition: .2s; font-size: 15px; color: var(--text); }
  .btn:hover { border-color: var(--violet); background: var(--glass-2); }
  .btn.again { background: rgba(165,148,255,.16); border-color: var(--violet); font-weight: 700; }
  .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btn-grid .btn { font-size: 14px; padding: 0 6px; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: rgba(30, 24, 60, .95); border: 1px solid var(--line-2); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; transition: .25s; z-index: 60; max-width: calc(100% - 32px); text-align: center; word-break: keep-all; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  footer { text-align: center; color: var(--text-3); font-size: 12.5px; margin-top: 46px; line-height: 1.9; word-break: keep-all; }

  @media (max-width: 520px) {
    .wrap { padding-top: 40px; }
    .panel { padding: 18px 14px; }
    .row { grid-template-columns: 1fr 1fr 34px; gap: 6px; }
    .del { width: 34px; }
    .ai-row { grid-template-columns: 1fr; }
    .person { grid-template-columns: 52px 1fr; padding: 14px; gap: 12px; }
    .portrait { width: 52px; height: 52px; }
    .btn-grid { grid-template-columns: 1fr 1fr; }
    .btn-grid .btn:last-child { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stars, .fog, .orb-mark, .go::after, .snap .mote { animation: none !important; }
    .reveal { animation-duration: .01s; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="stars"></div><div class="stars s2"></div><div class="fog f1"></div><div class="fog f2"></div></div>

<div class="wrap">
  <header>
    <div class="orb-mark" aria-hidden="true"></div>
    <div class="eyebrow">Past Life · Dream Archive</div>
    <h1>전생 체험관</h1>
    <p class="lead">함께 일하는 우리, 전생에선 어떤 사이였을까요?</p>
  </header>

  <section class="panel" aria-label="등장인물 입력">
    <p class="hint">팀명과 성명을 두 명 이상 적고, <b>전생 체험하기</b>를 눌러 주세요.</p>
    <div class="rows" id="rows"></div>
    <button class="add" id="addRow" type="button">＋ 한 명 더</button>

    <div class="tone" role="group" aria-label="인연의 분위기">
      <div class="tone-label">인연의 분위기</div>
      <button type="button" data-tone="any" aria-pressed="true">운명에 맡기기</button>
      <button type="button" data-tone="serious" aria-pressed="false">진중하게</button>
      <button type="button" data-tone="funny" aria-pressed="false">유쾌하게</button>
    </div>

    <button class="go" id="go" type="button">전생 체험하기</button>
    <div class="error" id="error" role="alert"></div>

    <details class="ai">
      <summary><b>✦ OpenAI 키로 더 생생하게</b> (선택) · <span id="modeLabel">지금은 내장 이야기로 보여 드려요</span></summary>
      <div class="ai-body">
        <div class="ai-row">
          <input class="field" id="apiKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" aria-label="OpenAI API 키" />
          <input class="field" id="model" value="gpt-4o-mini" spellcheck="false" aria-label="모델" list="models" />
          <datalist id="models"><option value="gpt-4o-mini"></option><option value="gpt-4.1-mini"></option><option value="gpt-4o"></option><option value="gpt-5-mini"></option></datalist>
        </div>
        <label class="check"><input type="checkbox" id="rememberKey" /> 이 브라우저에만 저장</label>
        <div>키는 이 브라우저에서 OpenAI로만 전송돼요. 실패하면 내장 이야기로 대신 보여 드려요.</div>
      </div>
    </details>
  </section>

  <section id="result" aria-live="polite"></section>

  <footer>모든 전생은 재미로 지어낸 이야기예요 · 연애·궁합 없음 · 개인정보 불필요<br />입력한 이름은 이 브라우저와 직접 공유한 링크에만 담겨요.</footer>
</div>

<div id="vortex" aria-hidden="true"><canvas id="vcanvas"></canvas><div class="whisper" id="whisper"></div><div class="flash" id="flash"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   1. 한국어 조사
   ========================================================= */
const JOSA = { '은': ['은', '는'], '는': ['은', '는'], '이': ['이', '가'], '가': ['이', '가'], '을': ['을', '를'], '를': ['을', '를'], '과': ['과', '와'], '와': ['과', '와'], '으로': ['으로', '로'], '로': ['으로', '로'], '도': ['도', '도'], '의': ['의', '의'], '이었다': ['이었다', '였다'] };
function lastJong(word) {
  const s = String(word).replace(/[\s\)\]\}"'”’.!?~]+$/g, '');
  const ch = s.charAt(s.length - 1), code = ch.charCodeAt(0);
  if (code >= 0xac00 && code <= 0xd7a3) return (code - 0xac00) % 28;
  if (/[0-9]/.test(ch)) return { 0: 21, 1: 8, 2: 0, 3: 16, 4: 0, 5: 0, 6: 1, 7: 8, 8: 8, 9: 0 }[ch];
  if (/[lmn]/i.test(ch)) return /l/i.test(ch) ? 8 : 4;
  if (/[a-z]/i.test(ch)) return 0;
  return -1;
}
function josa(word, j) {
  const pair = JOSA[j]; if (!pair) return j;
  const jong = lastJong(word);
  if (jong === -1) return pair[0] === pair[1] ? pair[0] : `${pair[0]}(${pair[1]})`;
  if (pair[0] === '으로') return (jong === 0 || jong === 8) ? '로' : '으로';
  return jong > 0 ? pair[0] : pair[1];
}
const fill = (tpl, v) => tpl.replace(/\{(\w+)(?:\|([^}]+))?\}/g, (_, k, j) => { const s = v[k] ?? ''; return j ? s + josa(s, j) : s; });
function joinKo(list) {
  if (list.length <= 1) return list[0] || '';
  if (list.length === 2) return list[0] + josa(list[0], '과') + ' ' + list[1];
  return list.slice(0, -1).join(', ') + ', ' + list[list.length - 1];
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* =========================================================
   2. 팀 성격 → 전생의 결
   ========================================================= */

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeRng(seed) { const r = mulberry32(seed >>> 0); return { pick: arr => arr[Math.floor(r() * arr.length)], shuffle: arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; } }; }
const teamLabel = t => (t && t.trim()) ? t.trim() : '소속 미정';

function generateBuiltin(people, tone, seed, avoidTitle) {
  const rng = makeRng(seed);
  let pool = SCENARIOS.filter(s => tone === 'any' || s.tone === tone);
  const fresh = pool.filter(s => !s.titles.includes(avoidTitle));
  const sc = rng.pick(fresh.length ? fresh : pool);
  const decks = new Map();
  const draw = (arc, field) => { const k = arc.key + field; if (!decks.get(k)?.length) decks.set(k, rng.shuffle(arc[field])); return decks.get(k).pop(); };
  const cast = people.map(p => { const arc = detectArchetype(p.team); return { team: teamLabel(p.team), name: p.name.trim(), arc: arc.key, role: draw(arc, 'roles'), skill: draw(arc, 'skills') }; });
  const [a, b] = cast, others = cast.slice(2);
  const v = { a: a.name, b: b.name, others: joinKo(others.map(o => o.name)) };
  const extras = rng.shuffle(sc.extras).concat(rng.shuffle(GENERIC_EXTRAS));
  const detail = (c, i) => {
    const base = i === 0 ? fill(sc.detailA, v) : i === 1 ? fill(sc.detailB, v) : fill(extras[(i - 2) % extras.length], { ...v, p: c.name });
    return `${base} ${sc.during} ${c.skill}.`;
  };
  v.othersStory = others.length ? fill(sc.othersStory, v) : '';
  return {
    title: rng.pick(sc.titles), era: sc.era, scene: sc.scene, tone: sc.tone, tag: sc.tag,
    snapshot: fill(sc.snapshot, v),
    summary: fill(sc.summary, v) + (others.length ? ' ' + fill(sc.othersSummary, v) : ''),
    people: cast.map((c, i) => ({ team: c.team, name: c.name, arc: c.arc, role: c.role, detail: detail(c, i) })),
    story: sc.story.map(p => fill(p, v).replace(/\s+$/, '')),
    now: fill(sc.now, v),
    source: 'builtin'
  };
}

const SYSTEM_PROMPT = `너는 '전생 체험관'의 이야기꾼이다. 같은 회사 동료들의 (팀명, 이름) 목록을 받아, 이들이 전생에 어떤 사이로 만났는지 꿈속 한 장면처럼 신비롭게 풀어 준다.
[핵심]
- 모두가 한 장면 안에서 얽힌 하나의 전생 인연을 만든다. 처음 두 사람이 인연의 중심이고, 나머지는 그 장면에 함께 있던 사람으로 각자 의미 있는 역할을 맡긴다.
- 각 팀의 결·성격·작업 무드를 전생의 직업·도구·행동에 자연스럽게 녹인다. 예) 개발팀: 구조·원리·기록·몰입 → 시계공, 천문관, 대장장이, 기록관 / 디자이너팀: 색채·비율·형태·미감 → 화원, 직조 장인, 도공, 정원 설계자. 처음 보는 팀명도 성격을 유추한다.
- 현대 IT·회사 용어는 전생 세계의 언어로 바꾼다. (단 "now" 한 줄은 현재 이야기이므로 예외)
- 설명은 구체적인 장면 묘사와 디테일로 생생하게, 하지만 요약을 먼저 짧게.
[금지] 1) 연애·궁합·커플·썸·혼인·설렘 등 로맨스 요소 2) 나이·성별·외모·연락처·주소·건강·종교·정치 등 개인정보·민감정보 언급이나 추정, 성별을 가정한 호칭 3) 업무 능력·성과·성향을 비하하거나 조롱하는 표현. 유머는 상황에서 나오게 하고, 누구도 놀림감으로 만들지 않는다.
이름과 팀명은 입력 그대로 쓰고, 반드시 JSON 객체 하나만 출력한다.`;

async function generateAI(people, tone, { apiKey, model, avoidTitle }) {
  const toneText = { serious: '진중하고 여운 있는', funny: '유쾌하고 위트 있는', any: '진중하거나 유쾌하거나, 이 조합에 더 어울리는' }[tone];
  const user = `등장인물(순서대로): ${JSON.stringify(people.map(p => ({ team: teamLabel(p.team), name: p.name.trim() })))}
분위기: ${toneText} 전생 인연.${avoidTitle ? ` 직전 결과("${avoidTitle}")와는 완전히 다른 시대·장소·관계로.` : ''}
배경 그림은 다음 중 가장 어울리는 하나를 "scene"에 넣어: clock(안개 낀 도시·시계탑), library(바다 위 섬·탑·도서관), palace(동양 궁궐·한옥·등불 거리), snow(눈 덮인 설원·산장), desert(사막·오아시스), sea(항구·배·바다).
JSON 형식:
{"title": "제목(18자 이내)", "era": "시대 · 장소 (예: 조선 · 한양 운종가 · 250년 전)", "scene": "...", "tone": "serious 또는 funny", "tag": "관계를 압축한 짧은 꼬리표(예: 앙숙 → 30년 동업자, 20자 이내)",
 "snapshot": "그날의 한 장면을 사진처럼 묘사한 한 문장(60자 이내)",
 "summary": "두 문장 이내의 핵심 요약 (~예요 체)",
 "people": [{"name": "이름", "team": "팀명", "role": "전생의 신분·직업 한 줄(30자 이내)", "detail": "그 사람이 이 인연에서 무엇을 했는지 구체적으로 2문장"}],
 "story": ["인연의 전말 1문단(2문장)", "2문단(2문장)", "3문단(1~2문장)"],
 "now": "그래서 지금도 ~ 로 시작하는 현생의 한 줄(유쾌하고 따뜻하게)"}`;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 45000);
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST', signal: controller.signal,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` },
      body: JSON.stringify({ model, response_format: { type: 'json_object' }, messages: [{ role: 'system', content: SYSTEM_PROMPT }, { role: 'user', content: user }] })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
    const o = JSON.parse(data.choices?.[0]?.message?.content || '{}');
    if (!o.title || !o.summary || !Array.isArray(o.people)) throw new Error('응답 형식이 올바르지 않아요');
    const cast = people.map((p, i) => {
      const hit = o.people.find(x => x && x.name === p.name.trim()) || o.people[i] || {};
      const arc = detectArchetype(p.team);
      return { team: teamLabel(p.team), name: p.name.trim(), arc: arc.key, role: String(hit.role || arc.roles[0]), detail: String(hit.detail || '') };
    });
    return {
      title: String(o.title), era: String(o.era || ''), scene: SCENE_KEYS.includes(o.scene) ? o.scene : 'clock', tone: o.tone === 'funny' ? 'funny' : 'serious', tag: String(o.tag || ''),
      snapshot: String(o.snapshot || ''), summary: String(o.summary), people: cast,
      story: (Array.isArray(o.story) ? o.story : String(o.story || '').split(/\n+/)).map(String).filter(Boolean),
      now: String(o.now || ''), source: 'ai', model
    };
  } catch (e) { throw e.name === 'AbortError' ? new Error('응답 시간이 초과됐어요') : e; }
  finally { clearTimeout(timer); }
}

function renderRows() {
  const box = $('#rows');
  box.innerHTML = state.rows.map((r, i) => `<div class="row" data-id="${r.id}">
      <input class="field" data-k="team" maxlength="20" placeholder="팀명" value="${esc(r.team)}" aria-label="${i + 1}번째 팀명" />

      <div class="trait">${esc(traitText(r.team.trim()))}</div></div>`).join('');
  box.querySelectorAll('.row').forEach(el => {
    const r = state.rows.find(x => x.id === +el.dataset.id);
    el.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', () => { r[inp.dataset.k] = inp.value; if (inp.dataset.k === 'team') el.querySelector('.trait').textContent = traitText(inp.value.trim()); $('#error').textContent = ''; });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); experience(false); } });
    });
    el.querySelector('.del').addEventListener('click', () => { state.rows = state.rows.filter(x => x.id !== r.id); renderRows(); });
  });
  $('#addRow').disabled = state.rows.length >= MAX;
  $('#addRow').textContent = state.rows.length >= MAX ? `최대 ${MAX}명까지 함께할 수 있어요` : '＋ 한 명 더';
}

const SENSITIVE = [/\d{2,3}[-.\s]?\d{3,4}[-.\s]?\d{4}/, /[\w.+-]+@[\w-]+\.[\w.]+/, /\d{6}[-\s]?[1-4]\d{6}/];
function validate() {
  const people = state.rows.filter(r => r.name.trim() || r.team.trim());
  if (people.some(p => !p.name.trim())) return { error: '성명이 비어 있는 줄이 있어요.' };
  if (people.length < 2) return { error: '전생의 인연은 두 사람부터 이어져요. 두 명 이상 적어 주세요.' };
  if (people.some(p => SENSITIVE.some(re => re.test(p.team + ' ' + p.name)))) return { error: '연락처·이메일 같은 개인정보로 보이는 내용은 적을 수 없어요.' };
  const names = people.map(p => p.name.trim());
  if (new Set(names).size !== names.length) return { error: '같은 성명이 두 번 적혀 있어요.' };
  return { people };
}

function vortex(work, count) {
  const box = $('#vortex'), cv = $('#vcanvas'), ctx = cv.getContext('2d'), wh = $('#whisper'), flash = $('#flash');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = W / 2, cy = H / 2, R = Math.hypot(W, H) / 2;
  const colors = ['#fff6d8', '#d9ceff', '#b9a6ff', '#f3a6c0', '#9fd8ff'];
  const parts = Array.from({ length: reduce ? 0 : 520 }, () => ({ a: Math.random() * Math.PI * 2, r: R * (0.35 + Math.random() * 0.9), s: 0.4 + Math.random() * 1.6, c: colors[(Math.random() * colors.length) | 0], w: 0.8 + Math.random() * 1.8 }));
  const lines = ['눈을 감고, 숨을 천천히 쉬어 보세요…', `${count}개의 기억이 같은 곳을 향해 흘러가요…`, '아주 오래전, 어느 날의 장면이 떠오릅니다…'];
  box.classList.add('show'); flash.style.transition = 'none'; flash.style.opacity = 0;
  ctx.fillStyle = '#05040b'; ctx.fillRect(0, 0, W, H);
  document.body.style.overflow = 'hidden';
  let li = 0; wh.textContent = lines[0]; wh.classList.add('on');
  const lineTimer = setInterval(() => { wh.classList.remove('on'); setTimeout(() => { li = Math.min(lines.length - 1, li + 1); wh.textContent = lines[li]; wh.classList.add('on'); }, 450); }, 1500);
  const t0 = performance.now(); let raf, done = false;
  const MIN = reduce ? 600 : 3600;
  const frame = now => {
    const t = (now - t0) / 1000, pull = Math.min(1, t / (MIN / 1000));
    ctx.fillStyle = `rgba(5,4,11,${0.16 + pull * 0.1})`; ctx.fillRect(0, 0, W, H);
    const core = 18 + pull * 70;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, core * 3);
    g.addColorStop(0, `rgba(255,248,230,${0.25 + pull * 0.6})`); g.addColorStop(0.4, `rgba(185,166,255,${0.15 + pull * 0.3})`); g.addColorStop(1, 'rgba(185,166,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, core * 3, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      const x0 = cx + Math.cos(p.a) * p.r, y0 = cy + Math.sin(p.a) * p.r * 0.78;
      p.a += (0.012 + 1.6 / (p.r + 30)) * p.s * (1 + pull * 2.5);
      p.r *= 1 - (0.006 + pull * 0.03) * p.s;
      if (p.r < 6) { p.r = R * (0.7 + Math.random() * 0.5); p.a = Math.random() * Math.PI * 2; continue; }
      const x1 = cx + Math.cos(p.a) * p.r, y1 = cy + Math.sin(p.a) * p.r * 0.78;
      ctx.strokeStyle = p.c; ctx.globalAlpha = Math.min(1, 0.25 + (1 - p.r / R)); ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (!done) raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
  const minWait = new Promise(r => setTimeout(r, MIN));
  return Promise.all([work, minWait]).then(([res]) => new Promise(resolve => {
    clearInterval(lineTimer); wh.classList.remove('on');
    flash.style.transition = `opacity ${reduce ? 150 : 650}ms ease-in`; flash.style.opacity = 1;
    setTimeout(() => {
      done = true; cancelAnimationFrame(raf);
      resolve(res);
      box.style.transition = 'opacity .9s ease'; box.style.opacity = 0;
      setTimeout(() => { box.classList.remove('show'); box.style.opacity = ''; box.style.transition = ''; document.body.style.overflow = ''; }, 900);
    }, reduce ? 150 : 700);
  }), err => { clearInterval(lineTimer); done = true; cancelAnimationFrame(raf); box.classList.remove('show'); document.body.style.overflow = ''; throw err; });
}

async function experience(again) {
  if (state.busy) return;
  const { people, error } = validate();
  if (error) { $('#error').textContent = error; return; }
  const sig = people.map(p => normTeam(p.team) + '/' + p.name.trim()).join('|') + '#' + state.tone;
  state.attempt = (again || sig === state.sig) ? state.attempt + 1 : 0;
  state.sig = sig;
  const apiKey = $('#apiKey').value.trim(), model = $('#model').value.trim() || 'gpt-4o-mini';
  const avoid = again && state.result ? state.result.title : '';
  state.busy = true; $('#go').disabled = true;
  let notice = '';
  const work = (async () => {
    if (apiKey) {
      try { return await generateAI(people, state.tone, { apiKey, model, avoidTitle: avoid }); }
      catch (e) { notice = `AI 연결에 실패해 내장 이야기로 보여 드려요 (${e.message})`; }
    }
    return generateBuiltin(people, state.tone, hashStr(sig) + state.attempt * 7919, avoid);
  })();
  try {
    const res = await vortex(work, people.length);
    state.result = res;
    renderResult(res, { notice });
  } finally { state.busy = false; $('#go').disabled = false; }
}

function renderResult(r, { notice = '', shared = false } = {}) {
  const box = $('#result');
  const motes = Array.from({ length: 9 }, (_, i) => `<span class="mote" style="left:${8 + i * 10.5}%;top:${30 + (i * 37) % 50}%;animation-delay:${(i * .7).toFixed(1)}s"></span>`).join('');
  const story = r.story.map(p => `<p>${esc(p)}</p>`).join('');
  const teaser = (r.story[0] || '').slice(0, 60);
  box.innerHTML = `<div class="reveal">
    ${shared ? '<div class="shared-note">누군가 공유한 전생 체험이에요 · 위에서 우리 팀의 전생도 체험해 보세요</div>' : ''}
    ${notice ? `<div class="shared-note">${esc(notice)}</div>` : ''}
    <div class="snap">${sceneSvg(r.scene, r.tone, r.people, r.snapshot)}${motes}</div>
    <p class="caption">${esc(r.snapshot)}</p>
    <div class="r-head">
      <div class="chips"><span class="chip">${esc(r.era)}</span>${r.tag ? `<span class="chip tag">${esc(r.tag)}</span>` : ''}</div>
      <h2 class="r-title">${esc(r.title)}</h2>
    </div>
    <div class="summary"><p class="label">Summary · 요약</p><p>${esc(r.summary)}</p></div>
    <p class="label" style="text-align:center">Who You Were · 각자의 전생</p>
    <div class="people">${r.people.map(p => `<div class="person">
        <div class="portrait" style="--tint:${arcByKey(p.arc).color}">${portraitSvg(p)}</div>
        <div><div class="p-name">${esc(p.name)}<span>${esc(p.team)}</span></div><div class="p-role">${esc(p.role)}</div><p class="p-detail">${esc(p.detail)}</p></div>
      </div>`).join('')}</div>
    <details class="story"><summary><span class="label">Story · 인연의 전말</span><span class="more">펼쳐 보기 ▾</span></summary>
      <div class="teaser">${esc(teaser)}…</div><div class="story-body">${story}</div></details>
    ${r.now ? `<p class="now">${esc(r.now)}</p>` : ''}
    <div class="actions">
      <button class="btn again" id="again" type="button">↻ 다른 전생도 체험하기</button>
      <div class="btn-grid">
        <button class="btn" id="copyText" type="button">결과 복사</button>
        <button class="btn" id="copyLink" type="button">링크 공유</button>
        <button class="btn" id="toTop" type="button">이름 바꾸기</button>
      </div>
    </div>
    <div class="shared-note" style="margin-top:14px">${r.source === 'ai' ? `AI 이야기 · ${esc(r.model || '')}` : '전생 체험관 내장 이야기'}</div>
  </div>`;
  $('#again').addEventListener('click', () => experience(true));
  $('#copyText').addEventListener('click', () => copyText(resultText(r), '결과를 복사했어요'));
  $('#copyLink').addEventListener('click', async () => {
    const url = await shareUrl(r);
    if (navigator.share && matchMedia('(pointer: coarse)').matches) navigator.share({ title: `전생 체험 · ${r.title}`, text: r.summary, url }).catch(() => copyText(url, '링크를 복사했어요'));
    else copyText(url, '링크를 복사했어요. 받은 사람은 이 장면을 그대로 볼 수 있어요');
  });
  $('#toTop').addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => document.querySelector('#rows input')?.focus(), 500); });
  box.querySelector('details.story').addEventListener('toggle', e => { e.target.querySelector('.more').textContent = e.target.open ? '접기 ▴' : '펼쳐 보기 ▾'; });
  setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'start' }), shared ? 0 : 120);
}

function resultText(r) {
  return [`✦ 전생 체험 · 「${r.title}」`, `${r.era}${r.tag ? ` · ${r.tag}` : ''}`, '', `📸 ${r.snapshot}`, '', `요약 — ${r.summary}`, '',
    ...r.people.map(p => `· ${p.name} (${p.team}) — ${p.role}\n  ${p.detail}`), '', '인연의 전말', ...r.story, '', r.now ? `✦ 현생에서 — ${r.now}` : '',
    '', `전생 체험관 · ${location.origin}${location.pathname}`].join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* ---------- 공유 링크 ---------- */
const b64u = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window) { try { const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate')); return 'z' + b64u(new Uint8Array(await new Response(st).arrayBuffer())); } catch {} }
  return 'u' + b64u(bytes);
}
async function unpack(str) {
  let bytes = unb64u(str.slice(1));
  if (str[0] === 'z') { const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate')); bytes = new Uint8Array(await new Response(st).arrayBuffer()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function shareUrl(r) {
  const o = { v: 3, t: r.title, e: r.era, k: r.scene, n: r.tone, g: r.tag, s: r.snapshot, m: r.summary, y: r.story, w: r.now, o: r.source, md: r.model || '', p: r.people.map(p => [p.team, p.name, p.arc, p.role, p.detail]) };
  return `${location.origin}${location.pathname}#r=${await pack(o)}`;
}
function fromShared(o) {
  if (!o || o.v !== 3 || !Array.isArray(o.p) || !o.t) return null;
  const S = x => String(x ?? '');
  return { title: S(o.t), era: S(o.e), scene: SCENE_KEYS.includes(o.k) ? o.k : 'clock', tone: o.n === 'funny' ? 'funny' : 'serious', tag: S(o.g), snapshot: S(o.s), summary: S(o.m),
    story: (Array.isArray(o.y) ? o.y : []).map(S), now: S(o.w), source: o.o === 'ai' ? 'ai' : 'builtin', model: S(o.md),
    people: o.p.slice(0, MAX).map(([team, name, arc, role, detail]) => ({ team: S(team), name: S(name), arc: S(arc), role: S(role), detail: S(detail) })) };
}

/* ---------- 공통 ---------- */
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg); } catch { toast('복사에 실패했어요'); }
    ta.remove();
  }
}
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} } };
function initKey() {
  const K = 'pastlife.openai.key', M = 'pastlife.openai.model';
  if (ls.get(K)) { $('#apiKey').value = ls.get(K); $('#rememberKey').checked = true; }
  if (ls.get(M)) $('#model').value = ls.get(M);
  const sync = () => {
    if ($('#rememberKey').checked && $('#apiKey').value.trim()) { ls.set(K, $('#apiKey').value.trim()); ls.set(M, $('#model').value.trim()); } else { ls.del(K); ls.del(M); }
    $('#modeLabel').textContent = $('#apiKey').value.trim() ? 'AI가 새로 지어 드려요' : '지금은 내장 이야기로 보여 드려요';
  };
  ['input', 'change'].forEach(ev => { $('#apiKey').addEventListener(ev, sync); $('#model').addEventListener(ev, sync); });
  $('#rememberKey').addEventListener('change', sync); sync();
}

async function init() {
  state.rows = [newRow(), newRow()];
  initKey();
  document.querySelectorAll('.tone button').forEach(b => b.addEventListener('click', () => {
    state.tone = b.dataset.tone;
    document.querySelectorAll('.tone button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  $('#addRow').addEventListener('click', () => { if (state.rows.length < MAX) { state.rows.push(newRow()); renderRows(); const ins = $('#rows').querySelectorAll('.row'); ins[ins.length - 1].querySelector('input').focus(); } });
  $('#go').addEventListener('click', () => experience(false));
  const m = location.hash.match(/#r=([\w-]+)/);
  if (m) {
    try {
      const r = fromShared(await unpack(m[1]));
      if (r) {
        state.rows = r.people.map(p => newRow(p.team === '소속 미정' ? '' : p.team, p.name));
        renderRows(); state.result = r; renderResult(r, { shared: true });
        history.replaceState(null, '', location.pathname);
        return;
      }
    } catch {}
  }
  renderRows();
}
init();
</script>
